# PdM-Live single-host stack (docs/04 §1, §4).
#   make up      everything: broker, database, backend (:8000), dashboard (:8080)
#   make infra   broker + database only, for running the backend/frontend from source (make backend, frontend-dev)
name: pdm-live

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.21
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/acl:/mosquitto/config/acl:ro
      - ./config/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: timescale/timescaledb:2.20.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pdm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdm} -d ${POSTGRES_DB:-pdm}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: pdm-live-backend:0.5.0
    restart: unless-stopped
    env_file: .env
    environment:  # container network names instead of localhost
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pdm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pdm}
      MQTT_HOST: mosquitto
      INGEST_URL: http://localhost:8000/api/v1/ingest
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
    stop_grace_period: 30s  # lets the MQTT workers drain their queues (docs/02 §8)

  frontend:
    profiles: ["app"]
    build: ./frontend
    image: pdm-live-frontend:0.5.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend: {condition: service_healthy}

volumes:
  mosquitto-data:
  pgdata:
