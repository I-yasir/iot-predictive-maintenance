[project]
name = "pdm-ml"
version = "0.1.0"
description = "PdM-Live ML: C-MAPSS data audit, causal features, RUL models and bundles"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyarrow==20.0.0",
    "scikit-learn==1.6.1",
    "lightgbm==4.6.0",
    "torch==2.7.1",  # P1.11 M2 sequence model (CPU is enough; ~1 s/epoch)
    "scipy==1.15.3",
    "joblib==1.5.1",
    "PyYAML==6.0.2",
    "matplotlib==3.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
    "pytest-cov==6.1.1",
    "hypothesis==6.135.0",
    "ruff==0.11.13",
    "mypy==1.16.0",
    "types-PyYAML",
    "jupyterlab==4.4.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdm_ml*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "B023"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["pdm_ml"]
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*", "ignore:.*resetCache.*"]
markers = ["slow: trains models on full subsets (deselect with -m 'not slow')"]
