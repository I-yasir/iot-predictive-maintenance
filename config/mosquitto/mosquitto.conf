# PdM-Live MQTT broker (Eclipse Mosquitto 2.0.21). docs/04 §5.1 and §7.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Plain MQTT for dev on a trusted LAN. Production: add a TLS listener on 8883 (docs/04 §7.7).
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# QoS 1 telemetry; bounded queues so a stalled consumer can't exhaust memory
max_queued_messages 10000
max_packet_size 8192
