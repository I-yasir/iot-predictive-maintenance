# Dashboard + reverse proxy (docs/04 §4). The browser only ever talks to :8080, so the session cookie stays
# same-origin (SameSite=Strict) and no CORS is needed.
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 4m;
  }

  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # hashed build files only: /assets/<asset id> is also a client-side route (component detail)
  location ~* ^/assets/.+\.(js|css|woff2?|svg|png|map)$ {
    expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404;
  }

  # client-side routes (/overview, /assets/FD001-T034, ...) all load the SPA
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
